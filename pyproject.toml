[build-system]
requires = ["uv_build>=0.8.19,<0.10.0"]
build-backend = "uv_build"

[project]
name = "blinkmimic"
version = "1.0.0"
description = "G1 three-stage carry-box learning with a differentiable world model and AMP."
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{ name = "Fuyi Chen" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab==1.6.0",
  "torch==2.10.0",
  "matplotlib",
  "pillow",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# CUDA 12.8 torch (Blackwell-capable); pinned to versions tested with this code.
constraint-dependencies = ["torch==2.10.0", "warp-lang==1.14.0", "mujoco==3.11.0", "mujoco-warp==3.11.0", "numpy==2.4.2"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
